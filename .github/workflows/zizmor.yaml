name: Zizmor

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required by codeql-action/upload-sarif to get workflow run info
      contents: read # Clone the repository
      security-events: write # Upload SARIF results to Code Scanning
    steps:
      - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1 (proprietary)
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            ghcr.io

      - name: Check out code
        uses: chainguard-actions/actions-checkout@0582da58055303b5af7f918994da1758ec9ca1bc # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: chainguard-actions/zizmorcore-zizmor-action@ed5e760c87c3f02dbd8ddcea24ae61fe32781f74 # v0.6.1
